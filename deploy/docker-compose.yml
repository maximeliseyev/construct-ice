# construct-veil-relay one-VPS deployment (local build of relay).
# Cover is an external image — see COVER.md and construct-docs modularity ADR.
#
#   export COVER_IMAGE=ghcr.io/<you>/<private-cover>:latest
#   # or: docker build -t my-cover:dev /path/to/private-cover && COVER_IMAGE=my-cover:dev
#   docker compose up -d

services:
  cover:
    image: ${COVER_IMAGE:?Set COVER_IMAGE to your private cover image (see deploy/COVER.md)}
    container_name: veil-front-cover
    restart: unless-stopped
    # :80 exposed on host for ACME http-01 + redirect-to-https.
    # :8080 internal — relay forwards unauth traffic here over the docker network.
    ports:
      - "80:80"
    expose:
      - "8080"
    volumes:
      - certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: veil-front-certbot
    # No `command` — invoked manually via `docker compose run`.
    entrypoint: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Override default restart so this container doesn't loop on completion.
    restart: "no"

  relay:
    build:
      context: .. # construct-veil repo root
      dockerfile: deploy/Dockerfile.relay
    image: construct-veil/relay:latest
    container_name: veil-front-relay
    restart: unless-stopped
    depends_on:
      cover:
        condition: service_started
    ports:
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      # Passed through so the healthcheck's `openssl s_client -servername ${DOMAIN}`
      # expands to a real hostname inside the container (else SNI is empty and the
      # relay rejects the handshake → container marked unhealthy).
      DOMAIN: "${DOMAIN}"
      # Issuer (home-server) Ed25519 PUBLIC key, hex. The relay validates each
      # presented capability offline against this key.
      ISSUER_PUBKEY: "${ISSUER_PUBKEY}"
    # Construct gRPC backend is reachable via host.docker.internal on Linux
    # only when --add-host is set; expose for portability.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      --listen 0.0.0.0:443
      --cert /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      --key  /etc/letsencrypt/live/${DOMAIN}/privkey.pem
      --site cover:8080
      --backend ${BACKEND:-host.docker.internal:50051}
      --issuer-pubkey ${ISSUER_PUBKEY}
    # Healthcheck — quick TLS handshake check.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo | openssl s_client -connect 127.0.0.1:443 -servername $$(echo $${DOMAIN}) -brief 2>&1 | grep -q 'Verification: OK\\|verify error' || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  letsencrypt:
  certbot-www:
