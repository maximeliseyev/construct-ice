# Overlay: domestic (relay_domestic) chains to an upstream clean front by IP.
#
# Topology (decisions/veil-relay-topology.md §3):
#
#   client → domestic.example.com (Selectel, this compose) ──chain──► 203.0.113.10:443
#              ExampleWeather cover                              (example-cover, clean)
#                                                              │ --backend-tls
#                                                              ▼
#                                                         ams / DO backend
#
# Dial upstream by IP (avoids DNS dependency / poisoning on the RU VPS); TLS still
# uses the real front SNI + SPKI pin so the LE cert validates.
#
# Usage on the NEARSKY VPS only (not on divany):
#   cp docker-compose.chain.yml .   # or -f both files
#   # fill CHAIN_* in .env — see .env.example chain section
#   docker compose -f docker-compose.prod.yml -f docker-compose.chain.yml up -d
#
# Prerequisites:
#   1. On this box: relay keypair
#        docker compose run --rm relay \
#          --generate-relay-keypair --chain-veil-sk-file /data/chain/veil_sk.hex
#      (mount a volume for /data/chain — see volumes below)
#   2. Home issuer signs ROLE_RELAY CapabilityV2 for that veil_pk
#      (veil-service IssueVeilCapability with role=1, or admin tooling).
#   3. Save the base64 blob to chain/capability.b64 on this VPS.
#   4. Deploy a relay image that accepts ROLE_RELAY on the clean front (gate fix).

services:
  relay:
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - chain-data:/data/chain:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DOMAIN: ${DOMAIN}
      ISSUER_PUBKEY: ${ISSUER_PUBKEY}
      # Upstream clean front — IP:port (divany VPS). SNI must match the cert on that IP.
      CHAIN_UPSTREAM_ADDR: ${CHAIN_UPSTREAM_ADDR:-203.0.113.10:443}
      CHAIN_UPSTREAM_SNI: ${CHAIN_UPSTREAM_SNI:-front.example.com}
      CHAIN_UPSTREAM_SPKI: ${CHAIN_UPSTREAM_SPKI}
    # Chain mode replaces local --backend dial: validated tunnels ferry through
    # the upstream veil-front. Cover site (--site) still serves unauth probes.
    command:
      - --listen
      - 0.0.0.0:443
      - --cert
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      - --key
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem
      - --site
      - cover:8080
      - --issuer-pubkey
      - ${ISSUER_PUBKEY}
      - --chain-upstream-addr
      - ${CHAIN_UPSTREAM_ADDR:-203.0.113.10:443}
      - --chain-upstream-sni
      - ${CHAIN_UPSTREAM_SNI:-front.example.com}
      - --chain-upstream-spki
      - ${CHAIN_UPSTREAM_SPKI}
      - --chain-capability-file
      - /data/chain/capability.b64
      - --chain-veil-sk-file
      - /data/chain/veil_sk.hex
    # Backend flags unused in chain mode but kept harmless if someone falls back.
    # Do not set BACKEND to DO from the RU box when chain is active.

volumes:
  letsencrypt:
  certbot-www:
  chain-data:
