# Overlay: relay_domestic chains to an upstream clean front (often by IP).
#
# Topology: construct-docs decisions/veil-relay-topology.md §3
# Ops recipe: deploy/CHAIN.md (no production hostnames in this file).
#
#   client → domestic front (this compose) ──chain──► <UPSTREAM_IP>:443 clean front
#              COVER_IMAGE (private)                    different cover brand
#                                                              │ --backend-tls
#                                                              ▼
#                                                         home backend
#
# Dial upstream by IP when DNS on the domestic box is flaky; TLS still uses the
# real clean-front SNI + SPKI pin.
#
# Usage on the DOMESTIC VPS only:
#   export COVER_IMAGE=ghcr.io/<you>/<domestic-private-cover>:latest
#   # fill CHAIN_* in .env — required, no public defaults
#   docker compose -f docker-compose.prod.yml -f docker-compose.chain.yml up -d
#
# Prerequisites: see deploy/CHAIN.md (keypair, ROLE_RELAY capability, SPKI).

services:
  relay:
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - chain-data:/data/chain:ro
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DOMAIN: ${DOMAIN}
      ISSUER_PUBKEY: ${ISSUER_PUBKEY}
      # Upstream clean front — IP:port. SNI must match the cert on that IP.
      CHAIN_UPSTREAM_ADDR: ${CHAIN_UPSTREAM_ADDR:?set CHAIN_UPSTREAM_ADDR}
      CHAIN_UPSTREAM_SNI: ${CHAIN_UPSTREAM_SNI:?set CHAIN_UPSTREAM_SNI}
      CHAIN_UPSTREAM_SPKI: ${CHAIN_UPSTREAM_SPKI:?set CHAIN_UPSTREAM_SPKI}
    # Chain mode replaces local --backend dial: validated tunnels ferry through
    # the upstream veil-front. Cover site (--site) still serves unauth probes.
    command:
      - --listen
      - 0.0.0.0:443
      - --cert
      - /etc/letsencrypt/live/${DOMAIN}/fullchain.pem
      - --key
      - /etc/letsencrypt/live/${DOMAIN}/privkey.pem
      - --site
      - cover:8080
      - --issuer-pubkey
      - ${ISSUER_PUBKEY}
      - --chain-upstream-addr
      - ${CHAIN_UPSTREAM_ADDR}
      - --chain-upstream-sni
      - ${CHAIN_UPSTREAM_SNI}
      - --chain-upstream-spki
      - ${CHAIN_UPSTREAM_SPKI}
      - --chain-capability-file
      - /data/chain/capability.b64
      - --chain-veil-sk-file
      - /data/chain/veil_sk.hex
    # Backend flags unused in chain mode. Do not dial the home backend directly
    # from a hostile-zone box when chain is active.

volumes:
  letsencrypt:
  certbot-www:
  chain-data:
