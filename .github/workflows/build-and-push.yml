name: Build & Push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cover applications are private / operator-owned — not built from this repo.
      # See deploy/COVER.md and construct-docs decisions/veil-example-cover-modularity.md

      # ── Relay ───────────────────────────────────────────────────────────
      - name: Build & push relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          push: true
          tags: ${{ env.REGISTRY }}/konstruct-msg/construct-veil/relay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
